{% extends "base.html" %}

{% block title %}Companhia{% endblock %}

{% block content %}

<h2 class="mb-4">
    {% if companhia %}Editar Companhia{% else %}Nova Companhia{% endif %}
</h2>

<div class="card card-glass p-4">
    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Nome da Companhia</label>
            <input type="text"
                   name="nome"
                   class="form-control"
                   value="{{ companhia.nome if companhia else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Sigla</label>
            <input type="text"
                   name="sigla"
                   class="form-control"
                   placeholder="Ex: Cia C Ap, 1ª Cia, 2ª Cia"
                   value="{{ companhia.sigla if companhia else '' }}">
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input"
                   type="checkbox"
                   name="ativa"
                   id="ativa"
                   {% if not companhia or companhia.ativa %}checked{% endif %}>

            <label class="form-check-label" for="ativa">
                Companhia ativa
            </label>
        </div>

        <button class="btn btn-success">Salvar</button>

        <a href="{{ url_for('fo.admin_companhias') }}" class="btn btn-secondary">
            Voltar
        </a>

    </form>
</div>

{% endblock %}
