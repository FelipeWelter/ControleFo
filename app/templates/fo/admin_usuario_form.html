{% extends "base.html" %}

{% block title %}Usuário{% endblock %}

{% block content %}

<h2 class="mb-4">
    {% if usuario %}Editar Usuário{% else %}Novo Usuário{% endif %}
</h2>

<div class="card card-glass p-4">

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Nome de Usuário</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   value="{{ usuario.username if usuario else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Senha
                {% if usuario %}
                    <small class="text-muted">(deixe em branco para manter)</small>
                {% endif %}
            </label>

            <input type="password"
                   name="senha"
                   class="form-control"
                   {% if not usuario %}required{% endif %}>
        </div>

<div class="mb-3">
    <label class="form-label">Permissões</label>

    {% set permissoes_usuario = usuario.permissoes.split(',') if usuario and usuario.permissoes else [] %}

    <div class="row">

        <div class="col-md-6">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="permissoes"
                       value="USUARIO"
                       id="permUsuario"
                       {% if not usuario or "USUARIO" in permissoes_usuario %}checked{% endif %}>

                <label class="form-check-label" for="permUsuario">
                    Usuário - Consulta pessoal
                </label>
            </div>
        </div>

        <div class="col-md-6">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="permissoes"
                       value="LANCADOR"
                       id="permLancador"
                       {% if "LANCADOR" in permissoes_usuario %}checked{% endif %}>

                <label class="form-check-label" for="permLancador">
                    Lançador - Lançamento de FO
                </label>
            </div>
        </div>

        <div class="col-md-6">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="permissoes"
                       value="CADASTRADOR"
                       id="permCadastrador"
                       {% if "CADASTRADOR" in permissoes_usuario %}checked{% endif %}>

                <label class="form-check-label" for="permCadastrador">
                    Cadastrador - Cadastro de militares
                </label>
            </div>
        </div>

        <div class="col-md-6">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="permissoes"
                       value="BOLETIM"
                       id="permBoletim"
                       {% if "BOLETIM" in permissoes_usuario %}checked{% endif %}>

                <label class="form-check-label" for="permBoletim">
                    Boletim - Exportação BI
                </label>
            </div>
        </div>

        <div class="col-md-6">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="permissoes"
                       value="HOMOLOGADOR"
                       id="permHomologador"
                       {% if "HOMOLOGADOR" in permissoes_usuario %}checked{% endif %}>

                <label class="form-check-label" for="permHomologador">
                    Homologador - Aprovação de FO
                </label>
            </div>
        </div>

        <div class="col-md-6">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="permissoes"
                       value="ADMIN"
                       id="permAdmin"
                       {% if "ADMIN" in permissoes_usuario %}checked{% endif %}>

                <label class="form-check-label" for="permAdmin">
                    Administrador - Acesso total
                </label>
            </div>
        </div>

    </div>
</div>

        <div class="mb-4">
            <label class="form-label">Militar Vinculado</label>

            <select name="militar_id"
                    class="form-select">

                <option value="">Nenhum</option>

                {% for militar in militares %}
                    <option value="{{ militar.id }}"
                        {% if usuario and usuario.militar_id == militar.id %}selected{% endif %}>
                        {{ militar.posto_graduacao.nome }} {{ militar.nome_guerra }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <button class="btn btn-success">
            Salvar
        </button>

        <a href="{{ url_for('fo.admin_usuarios') }}"
           class="btn btn-secondary">
            Voltar
        </a>

    </form>

</div>

{% endblock %}
