{% extends "base.html" %}

{% block title %}Esqueci minha senha{% endblock %}

{% block content %}

<div class="row justify-content-center w-100">
    <div class="col-md-6 col-lg-5">
        <div class="card login-card p-4">
            <h3 class="mb-2 text-center">Redefinição de Senha</h3>
            <p class="text-muted text-center small mb-4">
                Informe seus dados para solicitar ao administrador a redefinição da senha.
            </p>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <input type="text" class="form-control" name="username" required>
                    <div class="form-text">Normalmente é a identidade militar.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Identidade Militar</label>
                    <input type="text" class="form-control" name="identidade" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Observação</label>
                    <textarea class="form-control" name="observacao" rows="3" placeholder="Ex.: esqueci minha senha"></textarea>
                </div>

                <button class="btn btn-primary w-100">
                    Solicitar redefinição
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login') }}" class="small text-decoration-none">
                    Voltar para o login
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
